# Generate the Xcode project with:  xcodegen generate
name: PeakRemote
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Apple team here, or pick it in Xcode under Signing & Capabilities.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  PeakRemote:
    type: application
    platform: iOS
    sources:
      - PeakRemote
    info:
      path: PeakRemote/Info.plist
      properties:
        CFBundleDisplayName: Peak Remote
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSBluetoothAlwaysUsageDescription: Peak Remote uses Bluetooth to connect to and control your Puffco device.
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [bluetooth-le]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.PeakRemote
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  PeakRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PeakRemoteTests
    dependencies:
      - target: PeakRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.PeakRemoteTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PeakRemote:
    build:
      targets:
        PeakRemote: all
        PeakRemoteTests: [test]
    test:
      targets:
        - PeakRemoteTests
