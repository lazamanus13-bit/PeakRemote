# Builds Peak Remote on a GitHub-hosted Mac and produces an unsigned .ipa.
# Sideloadly (or a similar tool) signs it with your Apple ID when you install it.
name: Build iOS app

on:
  push:
    paths-ignore:
      - ".github/workflows/launch-test.yml"
      - ".github/workflows/xcode-compare.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project PeakRemote.xcodeproj \
            -scheme PeakRemote \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/PeakRemote.app

      - name: Package .ipa
        run: |
          rm -rf Payload PeakRemote.ipa
          mkdir -p Payload
          ditto build/Build/Products/Release-iphoneos/PeakRemote.app Payload/PeakRemote.app
          xattr -cr Payload
          zip -qr -X PeakRemote.ipa Payload
          echo "IPA contents:"
          unzip -l PeakRemote.ipa

      - name: Publish .ipa to Releases (direct download)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest PeakRemote.ipa \
            --title "Peak Remote (latest build)" \
            --notes "Built from commit ${GITHUB_SHA::7}. Download PeakRemote.ipa below and drag it into Sideloadly."

      - name: Run protocol tests
        continue-on-error: true
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcodebuild test \
            -project PeakRemote.xcodeproj \
            -scheme PeakRemote \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: PeakRemote-ipa
          path: PeakRemote.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
