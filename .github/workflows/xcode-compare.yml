# Manually triggered: lists the strongly-linked (non-weak) Swift/SwiftUI symbols the app imports,
# demangled, to spot anything that doesn't exist on older iOS versions.
name: Xcode compare

on:
  workflow_dispatch:

jobs:
  compare:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen && xcodegen generate
      - name: Build and inspect imports
        run: |
          xcodebuild build -project PeakRemote.xcodeproj -scheme PeakRemote \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO -quiet 2>&1 | grep -E "error:" | head -5
          BIN=build/Build/Products/Release-iphoneos/PeakRemote.app/PeakRemote
          xcrun vtool -show-build "$BIN" | head -20
          xcrun dyld_info -imports "$BIN" > imports.txt
          echo "== linked dylibs"; otool -L "$BIN"
          echo "== strong (non-weak) Swift imports, demangled"
          grep -v "weak-import" imports.txt | grep -oE '_\$s[A-Za-z0-9_]+|_swift_[A-Za-z0-9_]+' | sort -u > strong.txt
          wc -l strong.txt
          while read sym; do printf "%s\t%s\n" "$sym" "$(echo "$sym" | xcrun swift-demangle --simplified)"; done < strong.txt | cut -f2 | sort
          echo "== weak imports, demangled"
          grep "weak-import" imports.txt | grep -oE '_\$s[A-Za-z0-9_]+' | sort -u | xcrun swift-demangle --simplified
